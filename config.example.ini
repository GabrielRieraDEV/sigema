; =============================================================================
; SIGEMA — Archivo de configuración de ejemplo
;
; Copie este archivo como  config.ini  (en la misma carpeta del programa)
; y ajuste los valores a su instalación. NO comparta config.ini: contiene
; la contraseña de la base de datos.
; =============================================================================

[database]
; IP del SERVIDOR donde está instalado PostgreSQL.
; En cada computadora cliente debe apuntar a la IP del servidor en la LAN.
host = 192.168.1.100
port = 5432
dbname = sigema
user = sigema_user
password = cambiar_esto
; Tamaño del pool de conexiones (no es necesario modificarlo).
min_connections = 2
max_connections = 10

[app]
; Minutos de inactividad antes de cerrar la sesión automáticamente (NF-05).
session_timeout_minutes = 30
; Carpeta donde se guardan los respaldos (.sql) de la base de datos.
backup_folder = C:\SIGEMA\backups

[backup]
; Alias histórico de la carpeta de respaldos. Si define [app] backup_folder
; no necesita esta sección; se mantiene por compatibilidad.
directorio = C:\SIGEMA\backups
